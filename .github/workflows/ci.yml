name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'blog/**'
      - 'drafts/**'
      - '**/*.md'
      - 'scripts/serve-site.sh'
      - 'scripts/generate-blog-index.sh'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'blog/**'
      - 'drafts/**'
      - '**/*.md'
      - 'scripts/serve-site.sh'
      - 'scripts/generate-blog-index.sh'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: test
        run: cargo test
      - name: audit
        run: cargo install cargo-audit && cargo audit

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: test
        run: cargo test

  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: test
        run: cargo test
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: numa-windows-x86_64
          path: target/debug/numa.exe

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: build
        run: nix build .#numa
      - name: smoke test
        run: ./result/bin/numa --version
      - name: install from the store, then delete the store path
        run: |
          store=$(readlink -f result)
          sudo "$store/bin/numa" install
          sleep 2
          curl -sf http://127.0.0.1:5380/health
          # GC skips paths a running process uses, so the outage needs
          # numa stopped while its package loses every other root
          sudo systemctl stop numa
          rm result
          nix-store --delete "$store" || true
          sudo systemctl start numa
          sleep 2
          curl -sf http://127.0.0.1:5380/health
          dig @127.0.0.1 example.com +short +timeout=5 | grep -q '.'
          sudo "$store/bin/numa" uninstall
          test ! -e /nix/var/nix/gcroots/numa
      - name: diagnostics on failure
        if: failure()
        run: |
          sudo systemctl status numa --no-pager -l || true
          sudo journalctl -u numa --no-pager -n 100 || true
      - name: cleanup
        if: always()
        run: |
          sudo /nix/var/nix/gcroots/numa/bin/numa uninstall 2>/dev/null || true
          # see integration-linux cleanup: bridge systemd-resolved's restart stall
          sudo rm -f /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null
          getent hosts github.com >/dev/null

  cross-build-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cross
      - name: build
        run: cross build --target x86_64-unknown-freebsd --release

  integration-linux:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release
      - name: install / verify / re-install / uninstall
        run: |
          sudo ./target/release/numa install
          sleep 2
          curl -sf http://127.0.0.1:5380/health
          dig @127.0.0.1 example.com +short +timeout=5 | grep -q '.'
          user=$(ps -o user= -p "$(systemctl show -p MainPID --value numa)" | tr -d ' ')
          echo "numa running as: $user"
          test "$user" != "root"
          sudo ./target/release/numa install
          sleep 2
          curl -sf http://127.0.0.1:5380/health
          sudo ./target/release/numa uninstall
          sleep 1
          ! curl -sf http://127.0.0.1:5380/health 2>/dev/null
      - name: install from a homebrew keg, then delete the keg
        run: |
          keg=/home/linuxbrew/.linuxbrew/Cellar/numa/0.0.0/bin
          sudo mkdir -p "$keg"
          sudo chmod a+rx /home/linuxbrew /home/linuxbrew/.linuxbrew
          sudo cp target/release/numa "$keg/numa"
          sudo "$keg/numa" install
          sleep 2
          curl -sf http://127.0.0.1:5380/health
          # brew upgrade deletes the previous keg; restart stands in for a reboot
          sudo rm -rf /home/linuxbrew/.linuxbrew/Cellar/numa
          sudo systemctl restart numa
          sleep 2
          curl -sf http://127.0.0.1:5380/health
          dig @127.0.0.1 example.com +short +timeout=5 | grep -q '.'
          sudo ./target/release/numa uninstall
      - name: diagnostics on failure
        if: failure()
        run: |
          echo "=== systemctl status numa ==="
          sudo systemctl status numa --no-pager -l || true
          echo "=== journalctl -u numa (last 200) ==="
          sudo journalctl -u numa --no-pager -n 200 || true
          echo "=== ss -tulnp on 53/80/443/853/5380 ==="
          sudo ss -tulnp 2>/dev/null | grep -E ':(53|80|443|853|5380)\b' || true
          echo "=== systemctl is-active systemd-resolved ==="
          systemctl is-active systemd-resolved || true
      - name: cleanup
        if: always()
        run: |
          sudo ./target/release/numa uninstall 2>/dev/null || true
          # systemd-resolved has a ~40s DNS reconfiguration stall after
          # restart (systemd issue #22521) that breaks the runner agent's
          # connection to GitHub. Bridge it by replacing the stub-resolv
          # symlink with a direct upstream — DNS works instantly and the
          # runner can phone home for post-job steps.
          sudo rm -f /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null
          getent hosts github.com >/dev/null

  integration-macos:
    needs: [check-macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: build
        run: cargo build --release
      - name: install / verify / re-install / uninstall
        run: |
          sudo ./target/release/numa install
          sleep 2
          curl -sf http://127.0.0.1:5380/health
          dig @127.0.0.1 example.com +short +timeout=5 | grep -q '.'
          sudo ./target/release/numa install
          sleep 2
          curl -sf http://127.0.0.1:5380/health
          sudo ./target/release/numa uninstall
          sleep 1
          ! curl -sf http://127.0.0.1:5380/health 2>/dev/null
      - name: cleanup
        if: always()
        run: sudo ./target/release/numa uninstall 2>/dev/null || true
