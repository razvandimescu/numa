name: Docker

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish, e.g. v0.23.0'
        required: true

permissions:
  contents: read
  packages: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}

      - name: Fetch release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VERSION" -p 'numa-linux-x86_64.tar.gz*' -p 'numa-linux-aarch64.tar.gz*'
          sha256sum -c numa-linux-*.sha256
          for pair in amd64:x86_64 arm64:aarch64; do
            mkdir -p "dist/${pair%%:*}"
            tar xzf "numa-linux-${pair#*:}.tar.gz" -C "dist/${pair%%:*}"
          done

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Smoke-test binaries on Alpine
        run: |
          for arch in amd64 arm64; do
            docker run --rm --platform "linux/$arch" -v "$PWD/dist/$arch/numa:/numa:ro" alpine:3.24 /numa --version 2>&1 \
              | grep -Fx "numa ${VERSION#v}"
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: NUMA_BINARY=prebuilt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
