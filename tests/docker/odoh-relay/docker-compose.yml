# Caddy in front of a `numa relay` running on the host, mirroring the
# deployment in packaging/relay/. The Caddyfile is generated from the shipped
# one by tests/docker/odoh-relay-routing.sh so the routing rules under test
# are the rules we publish. Plain HTTP: numa's ODoH client pins the Mozilla
# roots, so a locally-issued cert would not be usable by it anyway, and the
# routing is what this stack exists to check.
services:
  caddy:
    image: caddy:2
    ports:
      - "127.0.0.1:${CADDY_PORT:-8081}:8081"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
